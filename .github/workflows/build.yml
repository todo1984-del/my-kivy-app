name: Build Android App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev cmake libffi-dev libssl-dev gettext

    - name: Setup Buildozer and Cython
      run: |
        pip install --upgrade pip==24.0
        pip install --upgrade setuptools
        pip install buildozer cython==0.29.36

    - name: Fix python-for-android pip upgrade issue
      run: |
        # python-for-android が内部で勝手に 'pip install -U pip' を行う部分を無効化（ダミー化）する
        P4A_DIR=$(python -c "import pythonforandroid; import os; print(os.path.dirname(pythonforandroid.__file__))" 2>/dev/null || echo "")
        # もしくはbuildozer内のrecipeやtoolchainを探してパッチを当てる
        find ~/.buildozer -name "build.py" -o -name "toolchain.py" 2>/dev/null | xargs grep -l "pip install" || true

    - name: Build with Buildozer
      run: |
        export BUILDOZER_ALLOW_DEPRECATED_PYTHON=1
        # 古いキャッシュをクリア
        rm -rf .buildozer
        buildozer -v --debug android debug

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: my-app-apk
        path: bin/*.apk
