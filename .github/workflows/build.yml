name: Build Android App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev cmake libffi-dev libssl-dev gettext

    - name: Setup Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install --upgrade setuptools
        pip install buildozer cython==0.29.36

    - name: Build with Buildozer
      run: |
        export BUILDOZER_ALLOW_DEPRECATED_PYTHON=1
        buildozer -v --debug android debug

    - name: Find and Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: my-app-apk
        path: |
          bin/*.apk
          .buildozer/android/platform/build--arm64-v8a/dists/mykivyapp/bin/*.apk
          bin/*
