name: Build Android App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev cmake libffi-dev libssl-dev gettext

    - name: Setup Buildozer and Cython
      run: |
        pip install --upgrade pip==24.0
        pip install --upgrade setuptools
        pip install buildozer cython==0.29.36

    - name: Build with Buildozer
      run: |
        export BUILDOZER_ALLOW_DEPRECATED_PYTHON=1

        # 古いキャッシュをクリア
        rm -rf .buildozer

        # あらかじめ一度ビルドを走らせて .buildozer 内に p4a をクローンさせる（失敗するので || true で受ける）
        buildozer --version || true

        # SDKライセンスを強制的に承認させるファイルを作成するハック
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        
        # 失敗するダミービルドを1回実行して android-sdk ディレクトリを生成させる
        buildozer -v --debug android debug || true

        # 生成された android-sdk に対して yes | sdkmanager --licenses を実行してライセンスを自動承認する
        if [ -d "$HOME/.buildozer/android/platform/android-sdk/tools/bin" ]; then
          yes | $HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager --licenses || true
        fi
        if [ -d "$HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin" ]; then
          yes | $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
        fi

        # 本番ビルド実行
        buildozer -v --debug android debug

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: my-app-apk
        path: bin/*.apk
