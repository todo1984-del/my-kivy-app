name: Build Android App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev cmake libffi-dev libssl-dev gettext

    - name: Setup Buildozer and Cython
      run: |
        pip install --upgrade pip==24.0
        pip install --upgrade setuptools
        pip install buildozer==1.5.0 cython==0.29.36

    - name: Force Android SDK Licenses
      run: |
        # Android SDKのライセンスフォルダを事前に強制作成し、同意済みハッシュを書き込む
        mkdir -p $HOME/.android
        echo "24333f8a43b682417157bc84b9e28f323719003d" > $HOME/.android/repositories.cfg
        
        # プレハブのライセンス承認ファイルを生成
        SDK_LICENSES="$HOME/.buildozer/android/platform/android-sdk/licenses"
        mkdir -p "$SDK_LICENSES"
        # Android SDKの主要なライセンスハッシュを書き込む
        echo "84831b8509b265738ab1d925828658161aefb4d0" > "$SDK_LICENSES"/android-sdk-license
        echo "24333f8a43b682417157bc84b9e28f323719003d" > "$SDK_LICENSES"/android-sdk-preview-license

    - name: Build with Buildozer
      run: |
        export BUILDOZER_ALLOW_DEPRECATED_PYTHON=1
        buildozer -v --debug android debug

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: my-app-apk
        path: bin/*.apk
