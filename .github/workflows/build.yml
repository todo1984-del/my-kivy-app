name: Build Android App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncurses5-dev cmake libffi-dev libssl-dev gettext

    - name: Setup Buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer

    - name: Build with Buildozer
      run: |
        export BUILDOZER_ALLOW_DEPRECATED_PYTHON=1
        rm -rf .buildozer
        # ログレベルを最高（2）にして、どこでエラーが起きているのかを隠さず全て出力させる
        buildozer -v --debug android debug

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
