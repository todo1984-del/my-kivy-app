name: Build Android App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev cmake libffi-dev libssl-dev gettext

    - name: Setup Buildozer and Cython
      run: |
        pip install --upgrade pip==24.0
        pip install --upgrade setuptools
        pip install buildozer cython==0.29.36

    - name: Build with Buildozer
      run: |
        export BUILDOZER_ALLOW_DEPRECATED_PYTHON=1
        
        # 古いキャッシュをクリア
        rm -rf .buildozer
        
        # ビルド実行前に、python-for-androidのビルドスクリプトから 'pip install -U pip' を消去するパッチを当てるためのバックグラウンド監視または事後パッチ
        # まず一度デバッグ用にビルドを回し、自動取得された p4a のコード内の pip upgrade を置換する
        
        # あらかじめビルドを走らせて .buildozer 内に p4a をクローンさせる（失敗するので || true で受ける）
        buildozer --version || true
        
        # .buildozer 内に展開された python-for-android の build.py から問題の行を強制削除
        find .buildozer -name "build.py" -type f -exec sed -i 's/pip install -U pip/echo "Skipped pip upgrade"/g' {} + || true
        find ~/.buildozer -name "build.py" -type f -exec sed -i 's/pip install -U pip/echo "Skipped pip upgrade"/g' {} + || true

        # 本番ビルド実行
        buildozer -v --debug android debug

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: my-app-apk
        path: bin/*.apk
