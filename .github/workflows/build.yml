name: Build Android App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    jobs:
  build:
    runs-on: ubuntu-22.04   # ← ここを ubuntu-latest から変更する

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get proxy and dependencies cache
      uses: actions/cache@v4
      with:
        path: |
          .buildozer
          ~/.gradle
        key: buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          buildozer-

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncurses5-dev cmake libffi-dev libssl-dev gettext

    - name: Setup Buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer

    - name: Build with Buildozer
      run: |
        export BUILDOZER_ALLOW_DEPRECATED_PYTHON=1
        # キャッシュや既存のビルドで中途半端に残っているlibffiのコンフィグをきれいに掃除
        rm -rf .buildozer/android/platform/build-arm64-v8a_armeabi-v7a/build/other_builds/libffi/armeabi-v7a/libffi-* || true
        buildozer -v android debug

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
