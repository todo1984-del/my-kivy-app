name: Build Android App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev cmake libffi-dev libssl-dev gettext

    - name: Setup Buildozer and Cython
      run: |
        pip install --upgrade pip==24.0
        pip install --upgrade setuptools
        pip install buildozer cython==0.29.36

    - name: Build with Buildozer
      run: |
        export BUILDOZER_ALLOW_DEPRECATED_PYTHON=1
        
        # 古いキャッシュをクリア
        rm -rf .buildozer
        
        # buildozerの実行前に、python-for-androidのソースを取得して pip install -U pip を無効化するパッチを当てるためのフック
        # (buildozer初回実行時に自動クローンされる python-for-android のコードを書き換えるラッパーを設定)
        mkdir -p ~/.local/bin
        cat << 'EOF' > ~/.local/bin/pip-wrapper
        # pip install -U pip が呼ばれたら何もしないで成功させる
        if [[ "$*" == *"install"* && "$*" == *"-U"* && "$*" == *"pip"* ]]; then
            echo "Intercepted pip upgrade, skipping to prevent compatibility error."
            exit 0
        fi
        exec pip "$@"
        EOF
        chmod +x ~/.local/bin/pip-wrapper
        
        buildozer -v --debug android debug

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: my-app-apk
        path: bin/*.apk
